name: imjustsheff bot

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for testing

# Never run two copies at once - they would fight over state.json.
concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write             # lets the bot save state.json and card images

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Make sure the card font is installed
        run: |
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || \
            (sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core)

      - name: Run the bot
        run: python -m bot.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}

      - name: Save state and card images
        if: always()
        run: |
          git config user.name "imjustsheff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state.json cards
          git diff --cached --quiet || (git commit -q -m "bot: update state" && git push -q)
