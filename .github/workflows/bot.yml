name: imjustsheff bot

on:
  schedule:
    # Every 5 minutes (GitHub's minimum), offset from :00 because GitHub drops many on-the-hour runs.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:          # "Run workflow" button for testing

# Never run two copies at once - they would fight over state.json.
concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write             # lets the bot save state.json and card images

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15    # Reels take a few minutes to edit and upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Set git identity (the bot pushes card images while posting)
        run: |
          git config user.name "imjustsheff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run the bot
        run: python -m bot.main
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_PAGE_ID: ${{ secrets.IG_PAGE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}

      # Only encrypted files and cards of posts you approved are ever committed.
      - name: Save encrypted state
        if: always()
        run: |
          for p in state.enc private cards; do [ -e "$p" ] && git add -A "$p"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: update state"
          # If the repo changed during the run (e.g. a code update was pushed), catch up and retry.
          for i in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase -X theirs
          done
          exit 1
